syntax = "proto3";

option go_package = "sql/mlagent/serverpb";

package predict;

// Interface exported by the server.
service KPredictionService {

  rpc KPredict(KPredictRequest) returns (KPredictResponse) {}

}

message KPredictRequest {
  string model_name = 1;

  string model_version = 2;

  bytes predict_inputs = 3;

  bytes predict_filter = 4;
}

message KPredictResponse {
  bytes predict_outputs = 1;
}






