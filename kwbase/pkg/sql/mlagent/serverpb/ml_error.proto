syntax = "proto3";

option go_package = "sql/mlagent/serverpb";

package mlError;

enum Code {
  Uncategorized = 0;
  // inference can not find model.
  ModelVersionNotExist = 1;
};

// Error contains all ML engine error fields.
message Error {
  Code code = 1;
  string message = 2;
}






