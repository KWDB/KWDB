syntax = "proto2";
// Beware! This package name must not be changed, even though it doesn't match
// the Go package name, because it defines the Protobuf message names which
// can't be changed without breaking backward compatibility.
package kwbase.cdcpb;
option go_package = "cdcpb";

import "roachpb/errors.proto";
import "gogoproto/gogo.proto";
import "sql/sqlbase/structured.proto";

// CDCCoordinator defines a gRPC server in each node that will be used to manage the lifecycle of CDC.
service CDCCoordinator {
  // StartTsCDC connect CDCCoordinator and start cdc task.
  rpc StartTsCDC (TsChangeDataCaptureRequest) returns (stream TsChangeDataCaptureEvent) {}
  // StopTsCDC stop cdc connection.
  rpc StopTsCDC (TsChangeDataCaptureStop) returns (Empty){}
  // TsCDC connect the CDCCoordinator.
  rpc TsCDC (stream TsChangeDataCaptureEvent) returns (stream TsChangeDataCaptureEvent) {}
}

message Empty {}

// CDCColumns contains the output columns of CDC.
message CDCColumns{
  // The ID list of columns that need to be captured in CDC, where these IDs are come from table descriptor.
  repeated uint32 cdc_column_ids = 1[(gogoproto.customname) = "CDCColumnIDs"];
  // The indexes of columns in table descriptor.
  repeated uint32 cdc_column_indexes = 2[(gogoproto.customname) = "CDCColumnIndexes"];
  // The data types of columns in table descriptor.
  repeated bytes cdc_types = 3 [(gogoproto.customname) = "CDCTypes", (gogoproto.customtype) = "gitee.com/kwbasedb/kwbase/pkg/sql/types.T"];
  // The names of columns in table descriptor.
  repeated string cdc_column_Names = 4[(gogoproto.customname) = "CDCColumnNames"];
  // Is it necessary to retrieve tags during the CDC process.
  optional bool need_normal_tags = 5;
}

// A TsChangeDataCaptureRequest sends the CDC metadata to every available node.
message TsChangeDataCaptureRequest {
  // The instance type of CDC task.
  required kwbase.sql.sqlbase.CDCInstanceType instance_type = 1 [(gogoproto.nullable) = false];
  // The output columns of CDC.
  optional CDCColumns cdc_columns = 2[(gogoproto.customname) = "CDCColumns"];
  // The stream metadata.
  optional StreamMetadata stream_metadata = 3;
  optional PipeMetadata pipeMetadata = 4;
  required uint64  instanceId = 5 [(gogoproto.nullable) = false, (gogoproto.customname) = "InstanceID"];
  optional PubMetadata pub_metadata = 6;
}

// TsChangeDataCaptureStart contains the information that will be used to start a CDC.
message TsChangeDataCaptureStart {
  // The instance type of CDC task.
  required kwbase.sql.sqlbase.CDCInstanceType instance_type = 1 [(gogoproto.nullable) = false];
  // The table id of CDC table.
  required uint64  table_id = 2 [(gogoproto.nullable) = false, (gogoproto.customname) = "TableID"];
  // The id of stream or other feature using CDC.
  required uint64 instance_id = 3 [(gogoproto.nullable) = false, (gogoproto.customname) = "InstanceID"];
}

// TsChangeDataCaptureStop contains the information that will be used to stop a CDC.
message TsChangeDataCaptureStop {
  // The instance type of CDC task.
  required kwbase.sql.sqlbase.CDCInstanceType instance_type = 1 [(gogoproto.nullable) = false];
  // The table id of CDC table.
  required uint64  table_id = 2 [(gogoproto.nullable) = false, (gogoproto.customname) = "TableID"];
  // The id of stream or other feature using CDC.
  required uint64 instance_id = 3 [(gogoproto.nullable) = false, (gogoproto.customname) = "InstanceID"];
}

// A TsChangeDataCaptureEvent combines all types of CDC events.
message TsChangeDataCaptureEvent {
  option (gogoproto.onlyone) = true;
  optional TsChangeDataCaptureValue      val = 1;
  optional TsChangeDataCaptureHeartbeat  heartbeat = 2;
  optional TsChangeDataCaptureStop       stop = 3;
  optional TsChangeDataCaptureRequest    request = 4;
  optional TsChangeDataCaptureStart      start = 5;
  optional TsChangeDataCaptureError      error = 9;
}

// TsChangeDataCaptureValue contains the data with low-water mark captured by CDC.
message TsChangeDataCaptureValue {
  // The timestamp of data from CDC.
  optional int64  ts = 1 [(gogoproto.nullable) = false];
  // The data from CDC.
  repeated bytes  val = 2;
  // The table id of data from CDC.
  required uint64 table_id = 3 [(gogoproto.nullable) = false, (gogoproto.customname) = "TableID"];
  // which format the val from cdc to be encoded in postgresql protocol.
  // It should be one of cdcpb.FormatSQL, cdcpb.FormatPGBindBinary, and cdcpb.FormatPGBindText.
  optional int32  format = 4;
  optional int32  row_number = 5;
  optional string cluster_id = 6 [(gogoproto.customname) = "ClusterID"];
  optional string operation = 7;

  // The timestamp of data from CDC.
  optional uint64  osn = 8 [(gogoproto.nullable) = false, (gogoproto.customname) = "OSN"];
}

// TsChangeDataCaptureHeartbeat contains the low-water mark that will send to CDC client.
message TsChangeDataCaptureHeartbeat {
  // The node id of heartbeat.
  required int32  node_id = 1 [(gogoproto.nullable) = false, (gogoproto.customname) = "NodeID"];
  // The watermark of heartbeat.
  optional int64  local_water_mark = 2 [(gogoproto.nullable) = false];
  // The table id of heartbeat.
  required uint64 table_id = 3 [(gogoproto.nullable) = false, (gogoproto.customname) = "TableID"];
}

// TsChangeDataCaptureError contains the possible error message that will persist by CDC client.
message TsChangeDataCaptureError {
  optional roachpb.Error error = 1 [(gogoproto.nullable) = false];
}

// Metadata used to initialize a CDC task for Stream
message StreamMetadata {
  // The stream id.
  required uint64 id = 1 [(gogoproto.nullable) = false, (gogoproto.customname) = "ID"];
  // The stream name.
  required string name = 2 [(gogoproto.nullable) = false];
  // If stream is enable.
  required bool   enable = 3 [(gogoproto.nullable) = false];
  // The stream parameters.
  required string parameters = 4 [(gogoproto.nullable) = false];
  // The metrics filter for cdc.
  optional bytes metrics_filter = 5;
  // The tag filter for cdc.
  repeated bytes tag_filter = 6;
}

message CDCTable {
  optional uint64 table_id = 1 [(gogoproto.nullable) = false, (gogoproto.customname) = "TableID"];
  repeated uint32 output_columns = 2;
  repeated string output_column_types = 3;
  repeated string output_column_names = 4;
  optional string database = 5 [(gogoproto.nullable) = false];
  optional string schema = 6 [(gogoproto.nullable) = false];
  optional string table = 7 [(gogoproto.nullable) = false];
  optional string ts_column = 8 [(gogoproto.nullable) = false];
  optional bool need_normal_tag = 9 [(gogoproto.nullable) = false];
  repeated string primary_tag_column_names = 10;
  repeated string normal_tag_column_names = 11;
  optional int32 ts_column_precision = 12 [(gogoproto.nullable) = false];
}

message PipeMetadata {
  optional uint64 id = 1 [(gogoproto.nullable) = false, (gogoproto.customname) = "ID"];
  optional string name = 2 [(gogoproto.nullable) = false];
  optional uint64 table_id = 3 [(gogoproto.nullable) = false, (gogoproto.customname) = "TableID"];
  optional bool enable = 4 [(gogoproto.nullable) = false];
  optional string sink = 5 [(gogoproto.nullable) = false];
  optional string message_format = 6 [(gogoproto.nullable) = false];
  repeated string output_column_names = 7;
  optional string filter = 8 [(gogoproto.nullable) = false];
  optional bytes metrics_filter = 9;
  repeated bytes tag_filter = 10;
  repeated uint32 output_columns = 11;
  repeated string output_column_types = 12;
  optional string database = 13 [(gogoproto.nullable) = false];
  optional string schema = 14 [(gogoproto.nullable) = false];
  optional string table = 15 [(gogoproto.nullable) = false];
  repeated CDCTable table_list = 16;
  optional bool ignore_history = 17 [(gogoproto.nullable) = false];
  optional uint64 buffer_size = 18 [(gogoproto.nullable) = false];
  optional string publish = 19 [(gogoproto.nullable) = false];
}

// PipeWatermarkSpec contains the specification for a pipe metadata that will used to process the captured change data.
message PipeWatermarkSpec {
  optional PipeMetadata metadata = 1 [(gogoproto.nullable) = false];
  optional int64 job_id = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.customname) = "JobID"
  ];
}

// PubMetadata is used to store metadata of publication.
message PubMetadata {
  optional uint64 id = 1 [(gogoproto.nullable) = false, (gogoproto.customname) = "ID"];
  optional string name = 2 [(gogoproto.nullable) = false];
  optional bytes parameters = 3;
  optional bytes metrics_filter = 4;
  repeated bytes tag_filter = 5;
}

// SubMetadata is used to store metadata of subscription.
message SubMetadata {
  optional uint64 id = 1 [(gogoproto.nullable) = false, (gogoproto.customname) = "ID"];
  optional string name = 2 [(gogoproto.nullable) = false];
  optional bytes parameters = 3;
}

// SubscriptionSpec contains the specification for a subscription metadata
// that will used to process the captured change data.
message SubscriptionSpec {
  optional SubMetadata sub_metadata = 1 [(gogoproto.nullable) = false];
  optional PubMetadata pub_metadata = 2 [(gogoproto.nullable) = false];
  optional int64 job_id = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.customname) = "JobID"
  ];
}
